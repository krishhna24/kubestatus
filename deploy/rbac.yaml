# Least-privilege, read-only access for kubestatus in a single namespace.
#
# kubestatus only issues `list` requests for Deployments and Pods; `get` is
# included so the same Role also works for `kubectl get <name>` checks.
# There are no write verbs, no wildcards, and no access to Secrets,
# ConfigMaps or any other resource.
#
# Usage:
#   1. Replace NAMESPACE with the namespace to inspect.
#   2. Replace the RoleBinding subject with the user, group or
#      ServiceAccount that runs kubestatus.
#   3. kubectl apply -f deploy/rbac.yaml
#
# To inspect several namespaces, apply one Role/RoleBinding per namespace
# rather than granting cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubestatus-reader
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: kubestatus
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubestatus-reader
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: kubestatus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubestatus-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kubestatus-user
